<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary SEO -->
    <title>Jobzy - Job Portal for Job Seekers and Recruiters</title>

    <meta
      name="description"
      content="Jobzy is a modern job portal that helps job seekers discover opportunities and enables recruiters to hire top talent faster."
    />

    <meta
      name="keywords"
      content="Jobzy, jobs, job portal, recruiters, hiring platform, careers, employment, apply jobs, companies, hiring, remote jobs"
    />

    <meta name="author" content="Jobzy" />
    <meta name="robots" content="index, follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="application-name" content="Jobzy" />
    <meta name="apple-mobile-web-app-title" content="Jobzy" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Canonical -->
    <link rel="canonical" href="https://job-zy.vercel.app/" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="shortcut icon" href="/favicon.ico" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="Jobzy" />

    <meta
      property="og:title"
      content="Jobzy - Job Portal for Job Seekers and Recruiters"
    />

    <meta
      property="og:description"
      content="Discover jobs, connect with top companies, and simplify hiring with Jobzy."
    />

    <meta property="og:url" content="https://job-zy.vercel.app/" />

    <meta
      property="og:image"
      content="https://job-zy.vercel.app/og-image.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://job-zy.vercel.app/og-image.png"
    />

    <meta property="og:image:type" content="image/png" />

    <meta property="og:image:width" content="1200" />

    <meta property="og:image:height" content="630" />

    <meta property="og:image:alt" content="Jobzy preview image" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Jobzy - Job Portal for Job Seekers and Recruiters"
    />

    <meta
      name="twitter:description"
      content="A modern hiring platform for job seekers, recruiters, and companies."
    />

    <meta
      name="twitter:image"
      content="https://job-zy.vercel.app/og-image.png"
    />

    <meta name="twitter:image:alt" content="Jobzy preview image" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Unbounded:wght@200..900&display=swap"
      rel="stylesheet"
    />

    <!-- Fontshare -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
